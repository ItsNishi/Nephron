name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore --locked-mode

      # TreatWarningsAsErrors is on in the csproj, so a warning fails the build here.
      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      # The allocation and detection guarantees are covered by the test suite; these
      # check the shipped CLI actually works end to end.
      - name: Canary - clean input is allowed
        run: dotnet run --project src/Nephron.Demo -c Release --no-build -- --canary clean

      - name: Canary - godmode marker is blocked
        run: dotnet run --project src/Nephron.Demo -c Release --no-build -- --canary godmode

      - name: Pack
        run: dotnet pack src/Nephron/Nephron.csproj -c Release --no-build -o ./artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
